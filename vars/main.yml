---

exabgp_pkg_version: "{% if exabgp_version is defined %}exabgp=={{ exabgp_version }}{% else %}exabgp{% endif %}"

exabgp_dirs:
  - { name: "/etc/exabgp", owner: "root", group: "root", perms: "0754" }
  - { name: "/usr/local/etc/exabgp", owner: "root", group: "root", perms: "0754" }
  - { name: "/run/exabgp", owner: "exabgp", group: "exabgp", perms: "0754" }

exabgp_svc_uri: "https://raw.githubusercontent.com/Exa-Networks/exabgp/master/etc/systemd/exabgp.service"
exabgp_config_path: "/etc/exabgp/exabgp.conf"
exabgp_svc_path: "/etc/systemd/system/exabgp.service"
exabgp_process_cfg: "/etc/exabgp/process.conf"

_exabgp_env_path:
  Debian:
    '12': "/usr/local/etc/exabgp/exabgp.env"
    '13': "/root/.venv/etc/exabgp/exabgp.env"
  Ubuntu:
    '22': "/usr/local/etc/exabgp/exabgp.env"
    '24': "/usr/local/etc/exabgp/exabgp.env"
  RedHat:
    '8': "/usr/local/etc/exabgp/exabgp.env"

exabgp_env_path:  "{{ _exabgp_env_path[ansible_distribution][ansible_distribution_major_version] }}"

exabgp_templates:
  - {
      src: "exabgp.conf.j2",
      dest: "{{ exabgp_config_path }}",
      owner: "exabgp",
      group: "nobody",
      mode: "0600",
    }

new_env_params:
  - { section: "exabgp.log", option: "level", value: "INFO" }
  - {
      section: "exabgp.log",
      option: "destination",
      value: "/var/log/exabgp.log",
    }

_python_requirements:
  default:
    - python3-pip
  Debian:
    - python3
  RedHat:
    - python3

python_requirements: "{{ _python_requirements['default'] + _python_requirements[ansible_os_family] }}"

pip_packages:
  - pip
  - setuptools
  - wheel

python3_command: python3
pip3_command: pip3
python3_pyenv: null
