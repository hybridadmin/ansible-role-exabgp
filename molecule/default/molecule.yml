dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: docker
platforms:
  - name: ${ROLE_NAME:-exabgp}-${MOLECULE_DISTRO:-ubuntu}-${MOLECULE_DISTRO_TAG:-jammy}
    image: "hybridadmin/ansible-${MOLECULE_DISTRO:-ubuntu}:${MOLECULE_DISTRO_TAG:-jammy}"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  log: true
  options:
    v: true
  config_options:
    defaults:
#      callback_whitelist: ansible.builtin.default
#      callback_result_format: yaml
#      bin_ansible_callbacks: yes
      verbosity: 1
#scenario:
#  test_sequence:
#    - create
#    - converge
#    - verify
#    - destroy
verifier:
  name: ansible
  enabled: False
