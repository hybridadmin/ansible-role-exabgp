---
- name: "latest python3 all other distros"
  block:
    - name: install python3 and pip3
      package:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ python_requirements }}"

  when: not (ansible_distribution == 'Ubuntu')

- name: get python executable
  shell: |
    set -o pipefail
    ls -l /usr/bin/python3.* | grep -E "python[0-9].[0-9]{1,2}$" | awk '{print $9}' | tail -n1
  args:
    executable: /bin/bash
  become: true
  register: python3_which
  changed_when: false

# https://github.com/pypa/pip/issues/5599
- name: "python3: upgrade pip"
  shell: |
    set -o pipefail
    if [[ "{{ ansible_distribution_release }}" =~ (bookworm|noble) ]]; then
        echo "pip installed via package so skipping upgrade for ansible_distribution_release {{ ansible_distribution_release }}"
    else
        {{ python3_which.stdout }} -m pip install --upgrade --force-reinstall {{ pip_packages | join(' ') }}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  register: pip_installed
#  when: not(ansible_distribution_release is regex('bookworm|noble'))
